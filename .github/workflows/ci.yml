name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # Root tsconfig.json has `include: ["src"]`, so this typechecks the root
      # package ONLY — it never sees packages/*. tsup strips types without
      # checking them, so `npm run build` stays green on a type error and this
      # is the only step that catches one.
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      # Every workspace, after the root build: mex-mcp imports `mex-agent`,
      # which resolves to the root dist/index.d.ts, so its typecheck is
      # meaningless (TS7016, implicit any) until dist/ exists. Deliberately NOT
      # `--if-present`: that exits 0 when a package has no typecheck script,
      # which is exactly how packages/mex-mcp went untypechecked in the first
      # place. Bare `--workspaces` fails loudly on a missing script, so a new
      # package cannot silently opt out of type safety.
      - run: npm run typecheck --workspaces
      - name: Smoke test packed graph CLI
        if: matrix.node-version == 22
        shell: bash
        run: |
          TARBALL="$(npm pack --silent | tail -n 1)"
          FIXTURE="$(mktemp -d)"
          mkdir -p "$FIXTURE/project/src"
          cd "$FIXTURE/project"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$TARBALL" --ignore-scripts >/dev/null
          printf 'export function greet(name: string): string { return `hello ${name}`; }\n' > src/sample.ts
          printf 'class Vehicle:\n    def drive(self):\n        return True\n' > src/sample.py
          printf 'pub struct User { pub name: String }\npub fn create_user() -> User { User { name: String::new() } }\n' > src/sample.rs
          MEX_TELEMETRY=0 ./node_modules/.bin/mex graph --json | grep '"nodesCreated"'
          MEX_TELEMETRY=0 ./node_modules/.bin/mex graph query where-defined greet | grep '"type":"result"'
          MEX_TELEMETRY=0 ./node_modules/.bin/mex graph query where-defined Vehicle | grep '"type":"result"'
          MEX_TELEMETRY=0 ./node_modules/.bin/mex graph query where-defined User | grep '"type":"result"'
